<!DOCTYPE html>
<html lang="fr-FR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Castrol Service Témara</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="images/icon-officiel-castrol-service-temara.webp" type="image/webp">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --castrol-green: #009737;
    --castrol-green-light: #00b04a;
    --castrol-red: #e2001a;
    --canvas: #0a0a0a;
    --ink: #ffffff;
    --body: #bbbbbb;
    --muted: #7e7e7e;
    --hairline: #3c3c3c;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
  }
  .stripe {
    height: 4px;
    width: 120px;
    margin: 0 auto 40px;
    background: linear-gradient(90deg, var(--castrol-green) 0 50%, var(--castrol-red) 50% 100%);
  }
  .logo { width: 160px; height: auto; margin-bottom: 32px; }
  .code {
    font-size: clamp(64px, 14vw, 120px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--castrol-green-light);
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 16px 0 12px;
    text-transform: uppercase;
  }
  p {
    font-size: 16px;
    font-weight: 300;
    line-height: 1.6;
    color: var(--body);
    max-width: 46ch;
    margin: 0 auto 32px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 16px 32px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background-color 200ms var(--ease-out), border-color 200ms var(--ease-out);
  }
  .btn-primary { background: var(--castrol-green); color: #fff; border: 1px solid var(--castrol-green); }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--hairline); }
  @media (hover: hover) and (pointer: fine) {
    .btn-primary:hover { background: var(--castrol-green-light); border-color: var(--castrol-green-light); }
    .btn-outline:hover { border-color: var(--ink); }
  }
  .btn:focus-visible { outline: 2px solid var(--castrol-green-light); outline-offset: 3px; }
  .tel { margin-top: 32px; font-size: 14px; color: var(--muted); }
  .tel a { color: var(--castrol-green-light); }
</style>
</head>
<body>
  <main>
    <div class="stripe"></div>
    <img class="logo" src="images/logo-png-castrol.png" alt="Castrol Service Témara" width="400" height="200">
    <p class="code">404</p>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée. Le garage, lui, est toujours à Témara.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour à l'accueil</a>
      <a class="btn btn-outline" href="/#contact">Prendre rendez-vous</a>
    </div>
    <p class="tel">Ou appelez directement le <a href="tel:0663850560">06 63 85 05 60</a></p>
  </main>
</body>
</html>
